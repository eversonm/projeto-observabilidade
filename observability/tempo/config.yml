target: all
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      # This Compose stack runs one Tempo instance. The default RF=3 leaves
      # the ingester ring without a valid replication set in a single node.
      replication_factor: 1
  max_block_duration: 5m
  trace_idle_period: 10s
compactor:
  compaction:
    block_retention: 168h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
    pool:
      max_workers: 100
      queue_depth: 10000
metrics_generator:
  ring:
    kvstore:
      store: inmemory
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: true
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]




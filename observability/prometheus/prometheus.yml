global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '^(products_http_requests_total|products_http_request_duration_seconds_(bucket|sum|count)|products_incident_recovery_duration_seconds_(bucket|sum|count))$'
        action: keep
  - job_name: api-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://api:8000/health/ready]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '^(probe_success|probe_duration_seconds)$'
        action: keep
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '^(pg_up|pg_stat_activity_count)$'
        action: keep
  - job_name: keycloak-postgres
    static_configs:
      - targets: [keycloak-postgres-exporter:9187]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '^(pg_up)$'
        action: keep
  - job_name: host
    static_configs:
      - targets: [node-exporter:9100]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '^(node_cpu_seconds_total|node_memory_Mem(Available|Total)_bytes|node_filesystem_(avail|size)_bytes)$'
        action: keep
  - job_name: containers
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
  - job_name: keycloak
    metrics_path: /metrics
    static_configs:
      - targets: [keycloak:9000]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop
  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]
    metric_relabel_configs:
      - source_labels: [__name__]
        action: drop

name: atividade-final
services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${API_DB_USER}:${API_DB_PASSWORD}@api-db:5432/${API_DATABASE}
      KEYCLOAK_ISSUER: http://localhost:${KEYCLOAK_PORT}/realms/${KEYCLOAK_REALM}
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SEED_TARGET_COUNT: ${SEED_TARGET_COUNT:-2000000}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      api-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [app, observability]

  api-db:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: ${API_DATABASE}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${API_DB_ADMIN_PASSWORD}
      API_DB_USER: ${API_DB_USER}
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD}
    ports: ["127.0.0.1:5435:5432"]
    volumes:
      - api_db_data:/var/lib/postgresql/data
      - ./database/api-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${API_DB_USER} -d ${API_DATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [app, observability]

  keycloak-db:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_ADMIN_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_EXPORTER_USER: ${KEYCLOAK_EXPORTER_USER}
      KEYCLOAK_EXPORTER_PASSWORD: ${KEYCLOAK_EXPORTER_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
      - ./database/keycloak-init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    networks: [app, observability]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"]
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [app, observability]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - postgres-exporter
      - keycloak-postgres-exporter
      - node-exporter
      - cadvisor
    restart: unless-stopped
    networks: [observability]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/config.yml"]
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./observability/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    restart: unless-stopped
    networks: [app, observability]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped
    networks: [observability]

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks: [observability]

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/config.yml"]
    ports: ["127.0.0.1:3200:3200"]
    volumes:
      - ./observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    restart: unless-stopped
    networks: [observability]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on: [tempo]
    restart: unless-stopped
    networks: [observability]

  alloy:
    image: grafana/alloy:v1.10.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on: [loki]
    restart: unless-stopped
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_EXPORTER_USER}:${POSTGRES_EXPORTER_PASSWORD}@api-db:5432/${API_DATABASE}?sslmode=disable
    depends_on:
      api-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [observability]

  keycloak-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${KEYCLOAK_EXPORTER_USER}:${KEYCLOAK_EXPORTER_PASSWORD}@keycloak-db:5432/${KEYCLOAK_DB}?sslmode=disable
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [observability]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --no-collector.thermal_zone
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped
    networks: [observability]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped
    networks: [observability]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    command: ["--config.file=/etc/blackbox/config.yml"]
    volumes:
      - ./observability/prometheus/blackbox.yml:/etc/blackbox/config.yml:ro
    restart: unless-stopped
    networks: [app, observability]

volumes:
  api_db_data:
  keycloak_db_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  tempo_data:
  alloy_data:

networks:
  app:
  observability:

